[package]
name = "fluent-sound-switcher"
version = "0.1.0"
description = "Switch Windows 11 audio input/output devices with a modern Fluent 2 UI"
authors = ["Gabriel Leocadio"]
edition = "2021"
license = "MIT"

[lib]
name = "fluent_sound_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
