name: Release

# Build the Windows installers and publish a GitHub Release when a version tag
# is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`). Can also be run
# manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the release notes can find the previous tag for the
          # compare link.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The version lives in three manifests and the updater compares versions:
      # publishing a tag that disagrees with the binary breaks update checks.
      - name: Verify version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.mjs ${{ github.ref_name }}

      # A tag must not publish what CI would have rejected.
      - name: Typecheck frontend
        run: pnpm lint

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — required, the updater rejects unsigned artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Fluent Sound Switcher ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          # Must be published, not a draft: the updater reads
          # `releases/latest/download/latest.json`, and GitHub excludes drafts
          # (and prereleases) from `releases/latest`. A draft release would make
          # every client's update check 404.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # `tauri-action` reuses an existing release for the tag and does not
      # promote one that is already a draft. That is how v0.1.1 and v0.1.2 ended
      # up stuck as drafts: GitHub excludes drafts from `releases/latest`, so
      # every client's update check 404'd even though the workflow said success.
      - name: Ensure the release is published
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --prerelease=false --latest

      # A copy of the installer under a name that never changes, so the README
      # and the release page can link straight at it:
      # releases/latest/download/FluentSoundSwitcher-Setup.exe
      # The versioned assets stay, for anyone who wants a specific build.
      - name: Publish a stable download link
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setup=$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -1)
          if [ -z "$setup" ]; then echo "no NSIS installer found"; exit 1; fi
          cp "$setup" FluentSoundSwitcher-Setup.exe
          gh release upload "${{ github.ref_name }}" FluentSoundSwitcher-Setup.exe --clobber

      # Lets users verify a download that SmartScreen warns about, since the
      # installers are not Authenticode-signed yet.
      - name: Publish checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=src-tauri/target/release/bundle
          # Two things make this fiddlier than it looks, and v0.2.0 shipped a
          # checksum file listing bare filenames with no hashes because of the
          # first:
          #   - the installer names contain spaces ("Fluent Sound Switcher_..."),
          #     so `sed 's#.*/##'` is greedy across the whole line and strips the
          #     hash along with the directory, and awk's $2 stops at the space;
          #   - GitHub replaces those spaces with dots in the published asset
          #     names, so hashing the local filenames would list names nobody
          #     can verify against what they downloaded.
          # Staging the files under their published names sidesteps both, and
          # hashing them from inside that directory keeps the paths relative
          # (sha256sum escapes a leading backslash otherwise).
          rm -rf checksums && mkdir checksums
          find "$bundle/msi" "$bundle/nsis" -type f \( -name '*.msi' -o -name '*.exe' \) |
            while IFS= read -r file; do
              cp "$file" "checksums/$(basename "$file" | tr ' ' '.')"
            done
          # Same binary as the NSIS asset, but it is the one the download button
          # points at, so it needs a line people can check it against.
          if [ -f FluentSoundSwitcher-Setup.exe ]; then
            cp FluentSoundSwitcher-Setup.exe checksums/
          fi
          ( cd checksums && sha256sum -- * ) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
